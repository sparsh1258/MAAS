name: prenatal_health_openenv
version: "3.1.0"
description: >
  MAAS is a multi-turn maternal-health triage environment for OpenEnv Theme 3.1.
  The agent reasons across a three-day prenatal trajectory, receives only partial
  information at first, can gather more evidence with request actions, and is scored
  with deterministic safety-first reward logic plus competition-grade synthetic
  scenario evaluation.

action_space:
  type: text_json
  required_keys:
    - action_type
    - rationale
  fields:
    action_type:
      type: string
      enum:
        - request_bp_recheck
        - request_kick_count
        - advance_day
        - refer_to_phc
        - diagnose
    target:
      type: string
      nullable: true
      enum:
        - preeclampsia
        - gestational_diabetes
        - anemia
        - preterm_risk
        - fetal_distress
        - low_risk
      description: Final diagnosis label when action_type=diagnose, otherwise null.
    urgency:
      type: string
      nullable: true
      enum:
        - monitor_at_home
        - visit_phc_this_week
        - go_to_hospital_today
      description: Final urgency when action_type=diagnose, otherwise null.
    rationale:
      type: string

observation_space:
  type: object
  fields:
    observation:
      type: object
      description: >
        Structured partially observable maternal-health observation for the
        current visible day in the three-day episode.
    text_observation:
      type: string
      description: >
        LLM-readable summary of the current day, visible vitals, danger flags,
        and any still-hidden information.
    system_prompt:
      type: string
    user_prompt:
      type: string
    response_format:
      type: string
    valid_conditions:
      type: array
      items: { type: string }
    valid_urgencies:
      type: array
      items: { type: string }

reward:
  description: >
    Reward is calculated inside the environment using a deterministic triage rubric
    plus trajectory-level target checks. The final diagnosis reward includes visible
    observation scoring, condition + urgency alignment against the hidden trajectory
    target, danger escalation bonuses, latent-risk consistency, over-escalation cost,
    under-escalation penalties, and premature false-reassurance penalties.
  range: [0.0, 1.0]
  notes:
    - request_bp_recheck: -0.05
    - request_kick_count: -0.05
    - repeated request on the same day: additional -0.10
    - advance_day: 0.0
    - refer_to_phc: +0.3 when PHC timing is appropriate, -0.2 when it is too slow
    - trajectory_condition_score: +2.0 for target match, -2.0 otherwise
    - trajectory_urgency_score: +1.5 for target urgency match
    - trajectory_under_escalation_penalty: -6.0 when urgency is below target urgency
    - trajectory_over_escalation_penalty: -2.0 per urgency tier above target urgency
    - premature_diagnosis_penalty: up to -10.0 for low-risk reassurance before hidden danger evidence is revealed
    - Normalization: (reward + 15) / 32 clipped to [0.0, 1.0]
  audit_fields:
    - raw_reward
    - adjusted_raw_reward
    - trajectory_condition_score
    - trajectory_urgency_score
    - trajectory_under_escalation_penalty
    - trajectory_over_escalation_penalty
    - premature_diagnosis_penalty

evaluation:
  benchmark_method: scripts/evaluate_multiturn.py
  metrics:
    - mean_reward
    - condition_accuracy
    - urgency_accuracy
    - under_escalation_rate
    - over_escalation_rate
    - json_valid_rate
    - mean_steps

environment_stats:
  multi_turn_trajectories: 8
  static_task_files: 15
  conditions_covered: 6
  difficulty_levels: 4
  regional_variants: 4

latent_risks:
  - postpartum_hemorrhage
  - maternal_infection
  - dehydration
  - intrahepatic_cholestasis
  - placental_abruption
  - maternal_exhaustion
  - nutrition_deficit
  - cholestasis
  - ectopic_residual_risk
  - maternal_sepsis
  - deep_vein_thrombosis
  - peripartum_cardiomyopathy

tasks:
  - task_1_easy
  - task_2_medium
  - task_3_hard
  - task_4_anemia_severe
  - task_5_preterm_early
  - task_6_mixed_signals
  - task_7_fetal_distress_silent
  - task_8_rural_access
  - task_9_hellp_proxy
  - task_10_gestational_htn
  - task_11_nutrition_collapse
  - task_12_multiparous_risk
  - task_13_adversarial_noise
  - task_14_latent_cholestasis
  - task_15_expert_triage

training:
  baseline_script: scripts/evaluate_multiturn.py
  notebook: niva_grpo_training.ipynb
  grpo_script: train_grpo.py
  multiturn_grpo_script: train_grpo_multiturn.py
  optional_notebook: niva_grpo_multiturn_training.ipynb
  trainer: Hugging Face TRL GRPO with optional Unsloth acceleration
  loop: >
    OpenEnv reset -> day-specific partially observable prompt -> multi-turn JSON
    action -> environment step -> cumulative trajectory reward -> GRPO update.

endpoints:
  reset:
    method: POST
    path: /reset
    returns: prompt_observation
  step:
    method: POST
    path: /step
    returns: step_result
  state:
    method: GET
    path: /state
    returns: environment_state

runtime:
  language: python
  entrypoint: uvicorn main:app --host 0.0.0.0 --port 7860
  port: 7860

